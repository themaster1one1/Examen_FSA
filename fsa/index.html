<title>FSA — Quiz de révision</title>
<style>
:root{
  --navy:#173A5E; --navy-2:#2E74B5; --paper:#FBF9F4; --card:#FFFFFF;
  --ink:#1E2A33; --muted:#6B7680; --amber:#C4661F; --good:#2F7D4F; --bad:#B4392E;
  --line:#E4DFD3;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#14181C; --card:#1B2126; --ink:#EDEBE4; --muted:#9AA3AB; --line:#2A3138;
  }
}
:root[data-theme="dark"]{
  --paper:#14181C; --card:#1B2126; --ink:#EDEBE4; --muted:#9AA3AB; --line:#2A3138;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*{box-sizing:border-box;}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  min-height:100%;
}
.wrap{max-width:640px; margin:0 auto; padding:28px 20px 60px;}
h1{
  font-family:Georgia,"Times New Roman",serif; font-weight:700;
  font-size:clamp(24px,5vw,32px); margin:4px 0 2px; letter-spacing:-0.01em;
}
.sub{color:var(--muted); font-size:14.5px; margin:0 0 20px; line-height:1.5;}
.chips{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:22px;}
.chip{
  border:1px solid var(--line); background:var(--card); color:var(--ink);
  padding:7px 14px; border-radius:20px; font-size:13.5px; cursor:pointer;
  transition:background .15s, color .15s, border-color .15s;
}
.chip.active{background:var(--navy); border-color:var(--navy); color:#fff;}
.progress-row{display:flex; align-items:center; gap:12px; margin-bottom:18px;}
.progress-track{flex:1; height:5px; background:var(--line); border-radius:3px; overflow:hidden;}
.progress-fill{height:100%; background:var(--navy-2); width:0%; transition:width .25s;}
.progress-label{font-size:13px; color:var(--muted); white-space:nowrap;}
.score{font-size:13px; color:var(--navy-2); font-weight:600; white-space:nowrap;}
.card{
  background:var(--card); border:1px solid var(--line); border-radius:14px;
  padding:24px 22px; box-shadow:0 1px 3px rgba(0,0,0,.05);
}
.tag{
  display:inline-block; font-size:12px; color:var(--navy-2); font-weight:600;
  margin-bottom:10px;
}
.prompt{font-size:17px; line-height:1.45; margin:0 0 18px; font-weight:600;}
.opt{
  display:block; width:100%; text-align:left; background:var(--paper);
  border:1px solid var(--line); border-radius:10px; padding:12px 14px;
  margin-bottom:9px; font-size:14.5px; color:var(--ink); cursor:pointer;
  line-height:1.4;
}
.opt:hover{border-color:var(--navy-2);}
.opt[disabled]{cursor:default;}
.opt.correct{background:rgba(47,125,79,.12); border-color:var(--good); color:var(--good); font-weight:600;}
.opt.wrong{background:rgba(180,57,46,.12); border-color:var(--bad); color:var(--bad); font-weight:600;}
.opt.dim{opacity:.5;}
.opt.sel{border-color:var(--navy-2); background:rgba(46,116,181,.12); font-weight:600;}
.feedback{
  margin-top:14px; padding:13px 15px; border-radius:10px; font-size:14px; line-height:1.5;
  border-left:3px solid var(--navy-2); background:var(--paper); display:none;
}
.feedback.show{display:block;}
.feedback b{color:var(--ink);}
.nav-row{display:flex; justify-content:space-between; align-items:center; margin-top:20px;}
.btn{
  border:none; border-radius:9px; padding:11px 20px; font-size:14.5px; font-weight:600;
  cursor:pointer; background:var(--navy); color:#fff;
}
.btn:disabled{background:var(--line); color:var(--muted); cursor:default;}
.btn.ghost{background:transparent; color:var(--muted); padding:11px 8px;}
.done{text-align:center; padding:36px 20px;}
.done .big{font-family:Georgia,serif; font-size:44px; font-weight:700; color:var(--navy);}
.done p{color:var(--muted); font-size:15px;}
</style>
</head>

<script>
const QUESTIONS = [
{c:1,q:"Selon le droit comptable belge, quel triplet correspond aux seuils d'une « grande entreprise » (comptes individuels) ?",o:["50 travailleurs / 11,25M€ CA / 6M€ total bilan","250 travailleurs / 42,5M€ CA / 21,25M€ total bilan","10 travailleurs / 900k€ CA / 450k€ total bilan","250 travailleurs / 50M€ CA / 43M€ total bilan"],a:0,e:"Grande entreprise (individuelle) : 50 travailleurs, 11.250.000€ de CA, 6.000.000€ de total bilan. Le 2e triplet, c'est le seuil de consolidation ; le 4e, les critères PME européens."},
{c:1,q:"Un groupe est dispensé de consolider s'il ne dépasse pas plus d'un des critères suivants :",o:["50 travailleurs / 11,25M€ / 6M€","250 travailleurs / 42,5M€ CA / 21,25M€ total bilan","100 travailleurs / 20M€ / 10M€","500 travailleurs / 100M€ / 50M€"],a:1,e:"Seuils d'obligation de consolider : 250 travailleurs, 42.500.000€ de CA, 21.250.000€ de total bilan."},
{c:1,q:"Quel est le délai correct pour la publicité des comptes annuels en Belgique ?",o:["AG < 6 mois après clôture, dépôt BNB < 1 mois après l'AG","AG < 3 mois, dépôt BNB < 6 mois","Dépôt direct BNB en 6 mois, sans AG","AG < 12 mois, dépôt BNB < 1 mois"],a:0,e:"Approbation par l'AG dans les 6 mois suivant la clôture, puis dépôt à la BNB dans le mois qui suit l'AG."},
{c:1,q:"Pour une petite entreprise (par opposition à une grande), lequel de ces éléments n'est PAS obligatoire ?",o:["Le bilan","Le compte de résultats","Le rapport de gestion","Les annexes (allégées)"],a:2,e:"Le rapport de gestion n'est pas obligatoire pour les petites et très petites entreprises ; leurs modèles de bilan, compte de résultats et annexes sont simplement adaptés (allégés)."},
{c:1,q:"Le bilan social (rapport social) reprend notamment :",o:["Uniquement le chiffre d'affaires","Le nombre de travailleurs, types de contrats, formations, mouvements de personnel","Le cours de l'action en bourse","Les seules dettes fournisseurs"],a:1,e:"Le bilan social est un modèle obligatoire belge reprenant les effectifs, les types de contrats, la répartition par genre/âge, les formations et les mouvements de personnel."},
{c:2,q:"Selon IAS 1, lequel de ces éléments ne fait PAS partie du jeu complet d'états financiers IFRS ?",o:["L'état de la situation financière","L'état du résultat global","Le rapport du commissaire aux comptes","Le tableau des flux de trésorerie"],a:2,e:"Les 4 états financiers IAS 1 sont bilan, compte de résultats, variation des capitaux propres et flux de trésorerie. Le rapport du commissaire est un document d'audit distinct, pas un état financier."},
{c:2,q:"Selon IAS 37, une provision doit être comptabilisée uniquement si :",o:["La perte est simplement possible","Obligation actuelle + sortie de ressources probable + montant estimable de façon fiable","La direction le décide librement","Le commissaire l'exige"],a:1,e:"IAS 37 impose 3 conditions cumulatives : obligation actuelle (légale ou implicite), sortie de ressources probable, montant estimable de manière fiable."},
{c:2,q:"IAS 2 impose quelle méthode d'évaluation des stocks (en-cours et produits finis) ?",o:["Le coût variable","Le coût complet (full costing)","La juste valeur uniquement","Le prix de vente estimé"],a:1,e:"IAS 2 impose le coût complet ; le coût variable, accepté en droit belge, n'est pas admis en IFRS."},
{c:2,q:"La « juste valeur » (IFRS 13) se définit comme :",o:["Le coût historique d'acquisition","Le montant auquel un actif pourrait être échangé entre parties bien informées et consentantes","Le prix fixé arbitrairement par la direction","La valeur nette comptable moins les amortissements"],a:1,e:"IFRS 13 : la juste valeur est le montant auquel un actif pourrait être échangé, ou un passif éteint, entre parties bien informées et consentantes dans des conditions de concurrence normale."},
{c:2,q:"Selon IAS 1, un actif est classé en actif courant si, entre autres :",o:["Il doit être réalisé dans le cycle d'exploitation normal ou dans les 12 mois suivant la clôture","Il est détenu depuis plus de 5 ans","Il s'agit d'un immeuble uniquement","Il n'a aucune valeur de marché"],a:0,e:"Sont courants les actifs destinés à être réalisés/vendus/consommés dans le cycle d'exploitation normal, détenus à des fins de transaction, ou la trésorerie elle-même."},
{c:3,q:"Quelle est la formule du ROE (Return On Equity) ?",o:["EBIT / Total des actifs","Résultat net / Capitaux propres","Résultat net / Chiffre d'affaires","Résultat net / Total des actifs"],a:1,e:"ROE = Résultat net / Capitaux propres. Ne pas confondre avec le ROA = EBIT / Total des actifs."},
{c:3,q:"Le ROA se calcule comme :",o:["Résultat net / Capitaux propres","EBIT / Total des actifs","EBIT / Capitaux propres","Marge brute / CA"],a:1,e:"ROA = EBIT / Total des actifs. EBIT ≈ Résultat net + charges d'intérêts + impôts."},
{c:3,q:"La marge brute (gross profit margin) se calcule :",o:["Marge brute / Chiffre d'affaires","Résultat net / Chiffre d'affaires","EBIT / Chiffre d'affaires","Dividendes / Résultat net"],a:0,e:"Marge brute = Marge brute (Ventes − Coût des ventes) / Chiffre d'affaires. Elle mesure directement la performance commerciale."},
{c:3,q:"Quelle est la cible habituelle du current ratio ?",o:["≈ 0,5","≈ 1","≈ 2","≈ 5"],a:2,e:"Current ratio (Actifs circulants / Passifs circulants) vise environ 2. Quick ratio et cash ratio visent plutôt ≈ 1."},
{c:3,q:"Le quick ratio se distingue du current ratio car il exclut :",o:["Les dettes financières LT","Les stocks","La trésorerie","Les créances clients"],a:1,e:"Quick ratio = (Actifs circulants − Stocks) / Passifs circulants : on retire l'élément le moins liquide, les stocks."},
{c:3,q:"Comment se calcule le fonds de roulement (FR) ?",o:["Actifs circulants − Passifs circulants","(Capitaux propres + Dettes LT) − Actifs non courants","Trésorerie − Dettes financières CT","Actifs circulants d'exploitation − Passifs circulants d'exploitation"],a:1,e:"FR = (Capitaux propres + Dettes LT) − Actifs non courants. Ne pas confondre avec le BFR (option 4) ni la trésorerie nette (option 3)."},
{c:3,q:"Un BFR négatif signifie que :",o:["L'entreprise a besoin de financement CT supplémentaire","Les ventes sont encaissées avant que les charges d'exploitation ne soient décaissées : excédent de financement CT","L'entreprise est en faillite","Les actifs non courants sont sous-financés"],a:1,e:"BFR < 0 : le chiffre d'affaires est encaissé avant le décaissement des charges d'exploitation, ce qui génère un excédent — mais crée une dépendance vis-à-vis des tiers."},
{c:3,q:"Comment se calcule le cycle d'exploitation (operating cash cycle) ?",o:["Délai stocks + Délai clients − Délai fournisseurs","Délai stocks + Délai fournisseurs − Délai clients","Délai clients − Délai fournisseurs − Délai stocks","Délai stocks × Délai clients / Délai fournisseurs"],a:0,e:"Cycle d'exploitation = Délai moyen de rotation des stocks + Délai moyen de paiement des clients − Délai moyen de paiement des fournisseurs."},
{c:3,q:"Un ratio de gearing (Dettes LT / Capitaux propres) élevé indique :",o:["Une forte dépendance aux capitaux propres","Un endettement LT élevé par rapport aux capitaux propres","Une excellente liquidité CT","Des dividendes élevés"],a:1,e:"Plus ce ratio est élevé, plus l'entreprise est endettée à long terme relativement à ses fonds propres."},
{c:3,q:"Le dividend payout ratio se calcule :",o:["Dividendes / Résultat net","Résultat net / Dividendes","Cours de l'action / EPS","Dividendes / Capitaux propres"],a:0,e:"Dividend payout ratio = Dividendes / Résultat net : proportion du bénéfice distribuée aux actionnaires."},
{c:3,q:"L'analyse verticale (« common size ») d'un bilan sert principalement à :",o:["Comparer plusieurs entreprises sur un même exercice, en % d'un poste de référence","Calculer uniquement le résultat net","Remplacer le tableau des flux de trésorerie","Éliminer les intérêts minoritaires"],a:0,e:"L'analyse verticale exprime chaque poste en % d'un poste clé (souvent le total du bilan ou le CA), ce qui permet la comparaison entre concurrents sur une même période ; l'analyse horizontale, elle, compare dans le temps."},
{c:4,q:"Dans le tableau des flux (méthode indirecte), l'amortissement de l'exercice est :",o:["Retranché du résultat net","Réintégré (ajouté) au résultat net, car charge non décaissée","Ignoré","Classé en CFF"],a:1,e:"L'amortissement réduit le résultat net sans sortie de trésorerie réelle : il faut donc le réajouter (l'ajouter) au résultat net dans le calcul du CFO."},
{c:4,q:"La méthode indirecte de construction du tableau des flux s'appuie sur :",o:["Les seuls extraits bancaires","Le compte de résultats et le bilan (utilisable en externe)","Le rapport du commissaire","Le bilan social"],a:1,e:"La méthode indirecte se base sur le compte de résultats et le bilan (donc exploitable même par un analyste externe), contrairement à la méthode directe qui exige les relevés bancaires internes."},
{c:4,q:"Une augmentation des stocks d'une année sur l'autre a quel impact sur le CFO ?",o:["Entrée de trésorerie (+)","Sortie de trésorerie (−)","Aucun impact","Impact seulement sur le CFI"],a:1,e:"Augmentation d'actif = sortie de cash (règle générale de la méthode indirecte)."},
{c:4,q:"Les 3 catégories du tableau des flux de trésorerie sont :",o:["Exploitation, Investissement, Financement","Ventes, Achats, Salaires","Actif, Passif, Capitaux propres","Direct, Indirect, Mixte"],a:0,e:"CFO (exploitation), CFI (investissement) et CFF (financement) sont les 3 sources de variation de trésorerie."},
{c:4,q:"La correction de la variation externe des capitaux propres sert à :",o:["Isoler la part de variation des capitaux propres non liée au résultat de l'exercice (ex. augmentation de capital)","Calculer le ROE","Remplacer l'amortissement","Éliminer les dettes fournisseurs"],a:0,e:"On calcule : (somme des variations des postes de capitaux propres) − (résultat de l'exercice − dividendes), pour isoler ce qui vient d'un apport externe (ex. augmentation de capital) plutôt que du résultat."},
{c:4,q:"Un investissement important en PPE (immobilisations corporelles) apparaît principalement dans :",o:["Le CFO","Le CFI","Le CFF","Aucun des trois"],a:1,e:"Les acquisitions/cessions d'actifs non courants (PPE, placements financiers…) relèvent du CFI (flux d'investissement)."},
{c:5,q:"À partir de quel seuil de détention le contrôle d'une filiale est-il présumé ?",o:["Plus de 20 %","Plus de 33 %","Plus de 50 %","100 % uniquement"],a:2,e:"Le contrôle est présumé quand la mère détient plus de 50 % des droits de vote ; en-dessous, un contrôle « de fait » reste possible via des accords."},
{c:5,q:"Quelle méthode s'applique à une « opération conjointe » (joint operation) ?",o:["Intégration globale","Intégration proportionnelle","Mise en équivalence","Exclusion pure et simple"],a:1,e:"Opération conjointe → intégration proportionnelle : données de la mère à 100 % + quote-part de la filiale commune, sans intérêts minoritaires."},
{c:5,q:"Une société associée (influence notable, sans contrôle) est traitée par :",o:["Intégration globale","Intégration proportionnelle","Mise en équivalence (valorisation, hors consolidation)","Élimination totale des actifs"],a:2,e:"Mise en équivalence : ce n'est pas une consolidation, la société associée n'est pas incluse — seule sa participation est réévaluée à hauteur de la quote-part des capitaux propres détenue."},
{c:5,q:"Dans un groupe en cascade (Mère → Sub1 → Sub2), le pourcentage d'intérêt de la Mère dans Sub2 se calcule en :",o:["Prenant le plus faible pourcentage de la chaîne","Multipliant les pourcentages successifs de la chaîne","Additionnant les pourcentages successifs","Ignorant Sub1"],a:1,e:"Le % d'intérêt se multiplie le long de la chaîne (ex. 80%×60%=48%) et sert à répartir le résultat entre groupe et NCI ; le % de contrôle, lui, ne se multiplie pas."},
{c:5,q:"Avant de consolider, les soldes et transactions intragroupe (dettes, produits, charges, dividendes) doivent être :",o:["Doublés","Éliminés en totalité","Convertis en devise étrangère uniquement","Ignorés s'ils sont peu significatifs"],a:1,e:"Les soldes et transactions intragroupe, ainsi que les profits/pertes qui en résultent, sont éliminés en totalité lors de la consolidation."},

];

  b.className = 'chip'; b.textContent = label; b.dataset.k = k;

  box.appendChild(b);

function inFilter(q){
  const f = String(filterChap);
  if(f==='C') return q.c!=='A';
  if(f==='A') return q.c==='A';
  if(f[0]==='A') return q.c==='A' && q.t.startsWith('Quizz '+f[1]);
  return String(q.c)===f;
}

function rebuild(){
  [...chips.children, ...chips2.children].forEach(c=>c.classList.toggle('active', c.dataset.k===String(filterChap)));
  order = QUESTIONS.map((q,i)=>i).filter(i=>inFilter(QUESTIONS[i]));
  const exam = String(filterChap)[0]==='A';
  document.querySelector('.sub').textContent = order.length + ' questions' + (exam ? ' d\'examen, dans l\'ordre du PDF.' : ' (chapitres seulement, sans le QCM examen), dans le désordre.');
  if(!exam){ for(let i=order.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [order[i],order[j]]=[order[j],order[i]]; } }
  idx = 0; correctCount = 0; answered = false;
  render();
}

function render(){
  const total = order.length; const scorable = order.filter(i=>QUESTIONS[i].k!=='n').length;
  document.getElementById('pfill').style.width = total? ((idx)/total*100)+'%' : '0%';
  document.getElementById('plabel').textContent = (idx+1<=total? idx+1 : total) + ' / ' + total;
  document.getElementById('scorelabel').textContent = correctCount + ' bonne' + (correctCount>1?'s':'');

  const area = document.getElementById('quizArea');
  if(total===0 || idx>=total){
    area.innerHTML = `<div class="card done">
      <div class="big">${correctCount} / ${scorable}</div>
      <p>Score sur cette série.</p>
      <button class="btn" id="restart">Recommencer</button>
    </div>`;
    document.getElementById('restart').onclick = rebuild;
    return;
  }
  const q = QUESTIONS[order[idx]];
  answered = false;
  area.innerHTML = `<div class="card">
    <span class="tag">${q.c==='A'?'QCM examen · '+q.t:'Chapitre '+q.c}</span>${q.d?'<span class="tag" style="color:var(--amber);margin-left:8px">⚠ à vérifier</span>':''}
    <p class="prompt">${q.q}</p>
    <div id="opts"></div>
    <div class="feedback" id="fb"></div>
    <div class="nav-row">
      <button class="btn ghost" id="skip">Passer</button>
      <button class="btn" id="next" disabled>Suivant</button>

  </div>`;
  const optsEl = document.getElementById('opts');
  const k = q.k||'s';
  const valBtn = ()=>{ const b=document.createElement('button'); b.className='btn'; b.textContent='Valider'; b.style.marginTop='6px'; return b; };
  if(k==='n'){
    optsEl.innerHTML = '<div style="background:rgba(196,102,31,.12);border-left:3px solid var(--amber);border-radius:8px;padding:12px 14px;font-size:14px;line-height:1.5;margin-bottom:10px"><b>Non corrigeable ici :</b> '+q.need+' Elle ne compte pas dans le score.</div>'
      + (q.o? q.o.map(t=>'<div class="opt" style="cursor:default">'+t+'</div>').join('') : '');
    if(q.known){ const b=document.createElement('button'); b.className='btn ghost'; b.textContent='Voir la réponse de mon fichier'; b.onclick=()=>{ const fb=document.getElementById('fb'); fb.classList.add('show'); fb.innerHTML='<b>Réponse du fichier :</b> '+q.known; b.remove(); }; optsEl.appendChild(b); }
    document.getElementById('next').disabled=false; answered=true;
  } else if(k==='g'){
    q.items.forEach(([st,,o2],r)=>{
      const w=document.createElement('div'); w.style.marginBottom='12px';
      const p=document.createElement('div'); p.textContent=st; p.style.cssText='font-size:14.5px;margin-bottom:5px;line-height:1.4';
      const sel=document.createElement('select'); sel.dataset.r=r;
      sel.style.cssText='width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;font-size:14px;background:var(--paper);color:var(--ink)';
      if(o2||q.o){ sel.innerHTML='<option value="">— choisir —</option>'+(o2||q.o).map(t=>'<option>'+t+'</option>').join(''); w.append(p,sel); }
      else { const inp=document.createElement('input'); inp.dataset.r=r; inp.autocomplete='off'; inp.style.cssText=sel.style.cssText; w.append(p,inp); }
      optsEl.appendChild(w);
    });
    const b=valBtn(); b.onclick=submitGroup; optsEl.appendChild(b);
  } else if(k==='t'){
    const inp=document.createElement('input'); inp.id='ti'; inp.placeholder='Ta réponse…'; inp.autocomplete='off';
    inp.style.cssText='width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;font-size:15px;background:var(--paper);color:var(--ink);margin-bottom:8px';
    const b=valBtn(); b.onclick=()=>submitText(inp.value);
    inp.onkeydown=e=>{ if(e.key==='Enter') b.click(); };
    optsEl.append(inp,b);
  } else {
    q.o.forEach((text,i)=>{
      const b = document.createElement('button');
      b.className = 'opt'; b.textContent = text;
      b.onclick = ()=> k==='m' ? b.classList.toggle('sel') : selectAnswer(i);
      optsEl.appendChild(b);
    });
    if(k==='m'){ const b=valBtn(); b.onclick=submitMulti; optsEl.appendChild(b); }
  }
  document.getElementById('skip').onclick = ()=>{ idx++; render(); };
  document.getElementById('next').onclick = ()=>{ idx++; render(); };
}

function finish(ok,q,extra){
  answered = true;
  if(ok) correctCount++;
  document.getElementById('scorelabel').textContent = correctCount + ' bonne' + (correctCount>1?'s':'');
  const fb = document.getElementById('fb');
  fb.classList.add('show');
  fb.innerHTML = (ok ? '<b>Correct.</b> ' : '<b>Pas tout à fait.</b> ') + (extra||'') + (q.e?' '+q.e:'') + (q.d?'<div style="margin-top:10px;padding:10px 12px;border-radius:8px;background:rgba(196,102,31,.12);border-left:3px solid var(--amber)"><b>⚠ À vérifier :</b> '+q.d+'</div>':'');
  document.getElementById('next').disabled = false;
}
function selectAnswer(i){
  if(answered) return;
  const q = QUESTIONS[order[idx]];
  [...document.querySelectorAll('#opts .opt')].forEach((el,j)=>{
    el.disabled = true;
    if(j===q.a) el.classList.add('correct');
    else if(j===i) el.classList.add('wrong');
    else el.classList.add('dim');
  });
  finish(i===q.a,q);
}
function submitMulti(){
  if(answered) return;
  const q = QUESTIONS[order[idx]];
  const els=[...document.querySelectorAll('#opts .opt')];
  let ok=true;
  els.forEach((el,j)=>{
    const sel=el.classList.contains('sel'), should=q.a.includes(j);
    el.disabled=true; el.classList.remove('sel');
    if(should) el.classList.add('correct'); else if(sel) el.classList.add('wrong'); else el.classList.add('dim');
    if(sel!==should) ok=false;
  });
  document.querySelector('#opts .btn').remove();
  finish(ok,q);
}
function submitGroup(){
  if(answered) return;
  const q = QUESTIONS[order[idx]];
  let good=0, wrong='';
  const nz=v=>String(v).toLowerCase().replace(/[\s%.,]/g,'');
  [...document.querySelectorAll('#opts select, #opts input')].forEach(sel=>{
    const r=Number(sel.dataset.r), ans=q.items[r][1], ok=sel.tagName==='INPUT'?nz(sel.value)===nz(ans):sel.value===ans;
    sel.disabled=true; sel.style.borderColor=ok?'var(--good)':'var(--bad)'; sel.style.color=ok?'var(--good)':'var(--bad)';
    if(ok) good++; else wrong+='<br>• '+q.items[r][0]+' → <b>'+ans+'</b>';
  });
  document.querySelector('#opts .btn').remove();
  finish(good===q.items.length,q,good+' / '+q.items.length+' justes.'+(wrong?' Corrections :'+wrong:''));
}
function submitText(v){
  if(answered) return;
  const q = QUESTIONS[order[idx]];
  const n=s=>String(s).toLowerCase().replace(/[\s%]/g,'');
  const inp=document.getElementById('ti'); inp.disabled=true; document.querySelector('#opts .btn').remove();
  finish(String(q.a).split('|').some(a=>n(v)===n(a)),q,'Réponse attendue : <b>'+String(q.a).split('|')[0]+'</b>.');
}

rebuild();
</script>
</body>
</html>
