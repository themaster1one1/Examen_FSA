<style>

select,button{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);cursor:pointer}

#score{margin-left:auto;font-weight:600}

.q p{margin:0 0 10px}
.btns{display:flex;gap:8px;font-family:system-ui,sans-serif}
.btns button{min-width:84px}
.q.done .btns button{cursor:default}
.btns button.good{background:var(--okbg);border-color:var(--ok);color:var(--ok);font-weight:600}
.btns button.bad{background:var(--kobg);border-color:var(--ko);color:var(--ko)}
.fb{display:none;margin-top:10px;font-family:system-ui,sans-serif;font-size:.9rem}
.q.done .fb{display:block}
.fb b.r{color:var(--ok)}.fb b.w{color:var(--ko)}
.note{margin-top:6px;color:var(--mute)}
.flag{background:var(--warnbg);color:var(--warn);padding:6px 8px;border-radius:6px;margin-top:6px}

/* ---- Questions ouvertes (section indépendante du QCM) ---- */
#oq{scroll-margin-top:110px;margin-top:48px;padding-top:8px;border-top:2px solid var(--line)}
#oq h2{margin-top:16px;font-size:1.15rem}
.oq-intro{color:var(--mute);margin:0 0 10px;font-size:.95rem}
.oq-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-family:system-ui,sans-serif;font-size:.9rem;margin-bottom:8px}
#oq-score{margin-left:auto;font-weight:600}
.oq-link{font-family:system-ui,sans-serif;font-size:.9rem;color:var(--acc)}
.oq-card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:10px 0}
.oq-tag{font-family:system-ui,sans-serif;font-size:.75rem;font-weight:600;color:var(--acc);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.oq-q{margin:0 0 10px}
.oq-ans{margin-top:12px;font-size:.95rem}
.oq-ans[hidden]{display:none}
.oq-pts{margin:0;padding-left:1.2rem}
.oq-pts li{margin:0 0 8px}
.oq-self{display:flex;gap:8px;margin-top:12px;font-family:system-ui,sans-serif}
.oq-self button.on-ok{background:var(--okbg);border-color:var(--ok);color:var(--ok);font-weight:600}
.oq-self button.on-ko{background:var(--kobg);border-color:var(--ko);color:var(--ko);font-weight:600}
.oq-empty{color:var(--mute);font-family:system-ui,sans-serif}
</style>

<main>
<header>

const $=s=>document.querySelector(s);
let items=[],ok=0,tot=0;
const sel=$("#ch");
sel.innerHTML='<option value="-1">Tous les chapitres</option>'+D.map((c,i)=>`<option value="${i}">${c[0]}</option>`).join("");
function build(shuffle){
  const v=+sel.value;ok=tot=0;
  let list=D.flatMap((c,ci)=>c[1].map(q=>({ci,q}))).filter(x=>v<0||x.ci===v);
  if(shuffle)list.sort(()=>Math.random()-.5);
  const root=$("#list");root.innerHTML="";
  let last=-1;
  list.forEach(({ci,q},n)=>{
    if(!shuffle&&ci!==last){last=ci;const h=document.createElement("h2");h.textContent=D[ci][0];root.appendChild(h)}
    const d=document.createElement("div");d.className="q";
    d.innerHTML=`<p></p><div class="btns"><button data-a="1">Vrai</button><button data-a="0">Faux</button></div><div class="fb"></div>`;
    d.querySelector("p").textContent=(shuffle?`[${D[ci][0].split(".")[0]}] `:"")+q[0];
    d.querySelectorAll("button").forEach(b=>b.onclick=()=>answer(d,q,+b.dataset.a));
    root.appendChild(d);
  });
  items=list;upd();
}
function answer(d,q,a){
  if(d.classList.contains("done"))return;
  d.classList.add("done");tot++;
  const right=a===q[1];if(right)ok++;
  d.querySelectorAll("button").forEach(b=>{
    const v=+b.dataset.a;
    if(v===q[1])b.classList.add("good");else if(v===a)b.classList.add("bad");
    b.disabled=true;
  });
  const flag=q[2]&&(q[2].startsWith("✏️")||q[2].startsWith("⚠️"));
  d.querySelector(".fb").innerHTML=`<b class="${right?"r":"w"}">${right?"Correct.":"Incorrect."}</b> Réponse : ${q[1]?"Vrai":"Faux"}.`+(q[2]?`<div class="${flag?"flag":"note"}"></div>`:"");
  if(q[2])d.querySelector(".fb div").textContent=q[2];
  upd();
}
function upd(){$("#score").textContent=`${ok} / ${tot} (sur ${items.length})`}
sel.onchange=()=>build(false);
$("#shuf").onclick=()=>build(true);
$("#rst").onclick=()=>build(false);
build(false);
</script>

 "En prenant appui sur la notion d’attachement actionnarial, présenter les différentes typologies d’actionnaires présents dans la structure de propriété des entreprises.",
 [["Avec attachement : famille","Attachement émotionnel. Cascade de holdings, capital cadenassé, peu d’OPA hostiles. Stratégie prudente, peu d’endettement, rémunération généreuse, présence au CA."],
  ["Avec attachement : État / collectivités","Attachement raisonné. Secteurs sensibles (armement, énergie…), stratégie conservatrice, rémunération importante, peu perméable aux fusions-acquisitions."],
  ["Avec attachement : salariés","Rarement actionnaire principal. Attachement à la fois raisonné et émotionnel (leur salaire dépend de l’entreprise)."],
  ["Avec attachement : autocontrôle","Part du capital détenue par l’entreprise elle-même via le rachat d’actions propres. Capital stable, attachement rationnel."],
  ["Sans attachement : investisseurs institutionnels","Long terme : veulent faire évoluer la gestion, parfois en entrant au CA. Court terme : participation plus faible, diversification de portefeuille. Objectif : maximiser la valeur boursière pour la plus-value ; entreprises souvent concernées par des fusions-acquisitions."],
  ["Sans attachement : partenaires industriels","Entreprise qui détient une partie du capital d’une autre : peut être un premier pas vers une reprise."],
  ["Sans attachement : flottant","Galaxie de petits porteurs sans représentation ni influence. Faible pouvoir actionnarial, grande latitude managériale, entreprises plus risquées. Plus le flottant est élevé, plus le capital est dispersé."]]],

["Cours",
 "Après avoir défini les investisseurs institutionnels, les classer, montrer les objectifs poursuivis et les liens avec la théorie de l’agence.",
 [["Définition","Entités qui collectent l’épargne et prennent des participations dans d’autres entreprises : banques, assurances, fonds de pension, fonds d’investissement…"],
  ["Classements possibles","National / international ; passif / actif ; court terme / long terme ; coté / non coté ; participations dans des entreprises cotées / non cotées."],
  ["Objectif","Maximiser la valorisation boursière pour réaliser une plus-value à la revente. Actif (long terme) : en s’impliquant dans la gestion. Passif (court terme) : sans s’impliquer, dans une logique de diversification."],
  ["Lien avec la théorie de l’agence","Principal (actionnaire) et agent (dirigeant) peuvent avoir des intérêts divergents, d’où des coûts d’agence, surtout quand le capital est très éclaté. Un II avec une participation importante agit comme modérateur : il pousse les dirigeants à aller dans le sens des actionnaires, sous peine de remplacement."]]],

["Cours",
 "Démontrer en quoi les investisseurs institutionnels pourraient être considérés comme des modérateurs de problèmes d’agence.",
 [["Problèmes visés","Comportement opportuniste des dirigeants, investissement excessif ou insuffisant, manipulation de l’information, dilution de la propriété."],
  ["Surveillance renforcée","Ils protègent leurs investissements en surveillant les dirigeants, ce qui réduit les asymétries d’information et aligne les intérêts."],
  ["Engagement proactif","Échanges avec la direction, participation aux assemblées générales : influence sur les décisions stratégiques."],
  ["Alignement à long terme","Des investisseurs comme les fonds de pension encouragent la stabilité et la croissance plutôt que les gains immédiats."],
  ["Meilleure gouvernance","Transparence, comités indépendants, rémunération liée à la performance : moins de marge pour les comportements déviants."]]],

["Cours",
 "Quelles sont les quatre grandes rubriques sur lesquelles les investisseurs institutionnels pourraient posséder une influence ? Expliquer.",
 [["Orientations stratégiques et financières","Pouvoir de proposition et de vote en AG : rachats d’actions propres, politique de dividendes, structure du capital."],
  ["Valorisation boursière","Leur entrée au capital est un signal (sous-valorisation perçue) que les petits investisseurs suivent : effet mouton."],
  ["Pérennisation des activités","Acteurs de long terme, ils peuvent encourager des pratiques durables, la R&D et l’anticipation des défis futurs."],
  ["Configuration générale d’un marché","Agissant collectivement, leurs investissements massifs orientent les tendances : valorisations, fusions-acquisitions, flux de capitaux."]]],

["Cours",
 "Présenter les variables qui permettent de différencier un investisseur institutionnel actif d’un investisseur institutionnel passif.",
 [["Orientation","Actif : volonté de renouveau industriel. Passif : spéculation à court terme, diversification de portefeuille."],
  ["Implication dans la gouvernance","Actif : forte, pour régler les problèmes d’agence. Passif : faible voire nulle, rôle d’observateur."],
  ["Niveau de participation","Actif : élevé (souvent plus de 10 %). Passif : faible (généralement 2 à 5 %)."],
  ["Liquidité","Actif : investissement peu réversible (une sortie brutale enverrait un signal négatif). Passif : liquidité élevée, sortie rapide possible."],
  ["Durée de présence","Actif : long terme (10 à 15 ans). Passif : court terme, approche opportuniste."],
  ["Structure du portefeuille","Actif : peu de participations mais importantes. Passif : portefeuille très diversifié, participations faibles."]],
 "ℹ️ Selon les formulations, on parle de cinq ou six variables ; six sont détaillées ici."],

["Cours",
 "Définir la notion d’activisme institutionnel.",
 [["Définition","Engagement proactif des investisseurs institutionnels dans la gouvernance d’une entreprise pour provoquer des changements significatifs dans son comportement ou ses règles, afin d’améliorer la valeur pour tous les actionnaires."],
  ["Dimensions","Contrôle de la gouvernance (AG, organes de décision) ; efforts proactifs pour changer le comportement de la firme ; usage des prérogatives des minoritaires ; voix et droits de vote pour maximiser la valeur."],
  ["Boîte à outils","Discussion informelle, puis campagne publique en cas d’échec, puis OPA organisée ou revente des participations."]]],

["Cours",
 "Présenter et expliquer les variables susceptibles de repérer les rapports de force capitalistiques sur un marché.",
 [["V1 : poids du plus grand actionnaire","Taille de l’actionnaire de référence par rapport au flottant (petits porteurs, instables et peu actifs en AG). Plus V1 est élevée, plus l’actionnaire de référence pèse."],
  ["V2 : écart entre le 1er et le 2e actionnaire","V2 = (part 1 − part 2) / part 1. Plus V2 est proche de 100 %, plus le deuxième actionnaire est en position de faiblesse face au premier."],
  ["V3 : poids des autres actionnaires","V3 = (part max − part moyenne des autres) / part max. Plus V3 est élevée, plus les autres actionnaires sont petits face à l’actionnaire de référence."],
  ["V4 : nombre d’autres actionnaires","Nombre d’actionnaires présents en même temps que l’actionnaire de référence : beaucoup = pouvoir dispersé, peu = pouvoir concentré."]],
 "ℹ️ L’énoncé parle parfois de trois variables, mais quatre sont généralement présentées. ⚠️ Formule exacte de V1 à vérifier avec le cours."],

["Cours",
 "Présenter et expliquer les différentes formes de capitalisme théoriquement envisageables sur un marché donné.",
 [["Capitalisme de marché financier (shareholders)","Typique des marchés anglo-saxons : actionnariat dispersé, aucun actionnaire en position de force, pression actionnariale limitée. Grande autonomie et latitude managériale pour les dirigeants."],
  ["Capitalisme patrimonial traditionnel","Actionnaire dominant (famille ou État) qui impose sa vision. Fort attachement à la continuité, à l’autonomie et à l’indépendance de l’entreprise."],
  ["Capitalisme patrimonial moderniste","Forte présence et implication des investisseurs institutionnels, souvent actionnaires de référence. Objectif central : maximiser la valorisation boursière et la création de valeur actionnariale."]]],

["Cours",
 "Présenter et développer la notion de coalition actionnariale.",
 [["Définition","Groupe d’actionnaires partageant des intérêts communs et collaborant pour atteindre des objectifs précis : long terme (consolidation de l’actionnariat) ou court terme (extraction de rente boursière)."],
  ["Forme","Peut reposer sur une relation contractuelle : les actionnaires agissent de concert."],
  ["Intérêt","Des actionnaires de même profil, par exemple plusieurs II, se coalisent pour maximiser leur influence et leur fonction d’utilité."],
  ["Mesure","V1 = poids de la plus grande coalition (part de la première coalition rapportée au capital hors flottant). V2 = (coalition 1 − coalition 2) / coalition 1. Valeurs élevées : coalition dominante en position de force."],
  ["Exemple : Lagardère","La famille Lagardère (environ 8 %) cherche du soutien. Amber, activiste, veut changer la gestion. Vivendi, d’abord chevalier blanc, rachète la part d’Amber et prend le contrôle du groupe."]]],

["Cours",
 "Présenter et développer la vision principal/principal de la théorie de l’agence dans sa version reformulée.",
 [["Point de départ","Théorie de l’agence classique : conflit entre actionnaires (principaux) et dirigeants (agents) à cause de divergences d’intérêts."],
  ["Évolution","Le conflit se déplace entre coalitions actionnariales, surtout quand la structure de propriété est complexe et compte plusieurs groupes importants."],
  ["Analyse","On compare les rapports de force entre coalitions avec V1 (poids de la plus grande) et V2 (distance entre la première et la deuxième)."],
  ["Lecture","V1 et V2 élevées : coalition dominante renforcée, moins de négociation et de contre-pouvoirs. Valeurs plus faibles : relations plus équilibrées. Coalitions typiquement opposées : long terme contre court terme."]]],

["Cours",
 "Expliquer la notion de cœur financier et ses implications en termes de mouvements sur le capital des entreprises.",
 [["Définition","Ensemble d’alliances intergroupes (les pôles), stables et durables, qui jouent un rôle central dans le paysage financier."],
  ["Fonction","Créer des conditions durables et favorables à la restructuration industrielle (fusions, acquisitions)."],
  ["Implications sur le capital","Relations durables (participations croisées), gestion des décisions d’achat, de vente et d’investissement, moteur de changements structurels dans la composition du capital."],
  ["Exemple","France, années 90 : pôles autour de SG, BNP, AXA/UAP."]]],

["Cours",
 "En quoi le cas de l’entreprise Lagardère constitue-t-il une illustration de la théorie de l’hubris ?",
 [["La théorie","Dans une OPA, le dirigeant de l’initiateur peut agir par ego ou excès de confiance, pour prendre le contrôle à tout prix plutôt que par rationalité économique."],
  ["Arnaud Lagardère","Il vit l’activisme d’Amber comme une remise en cause personnelle. Il crut que le statut de SCA le protégerait indéfiniment (contrôle avec environ 7 à 13 % du capital) et n’anticipa pas la coalition adverse."],
  ["Choix stratégiques","Abandon du cœur de métier industriel (aéronautique, EADS) pour une nébuleuse d’activités sans synergies (médias, sport, travel retail) : groupe vulnérable au démantèlement."],
  ["Réseau d’amis","Recours à des chevaliers blancs (Vivendi/Bolloré, LVMH/Arnault) sur la base de relations personnelles ; ces alliés agissaient par cynisme utilitaire."],
  ["Côté Vivendi","L’entrée de LVMH au capital accélère la stratégie de Vivendi : le prix devient très élevé, c’est un combat de pouvoir pour évincer un rival. Amber joue le rôle de pivot."]]],

["Cours",
 "Quelle est la différence entre la situation financière en France et en Belgique ?",
 [["Cadre général","Six configurations de propriété, du modèle stakeholders (famille, État, autocontrôle, fort attachement) au modèle shareholders (capital éclaté, II tournés vers le profit), et trois formes de capitalisme : marché financier, patrimonial traditionnel (Belgique), patrimonial moderniste (France)."],
  ["Belgique","SGB créée en 1822 pour préserver l’indépendance économique nationale. Déclin dans les années 70-80 (désinvestissements, gestion trop centralisée). En 1988, OPA hostile de De Benedetti : la SGB appelle Suez, le centre de décision passe à Paris. Marché réduit, familial, dominé par le capitalisme patrimonial traditionnel (BEL20)."],
  ["France","Nationalisations (après-guerre, 1981) puis reprivatisation dès 1986. Noyaux durs de banques (BNP, AXA, SG) avec participations croisées, qui éclatent avec la bataille de Paribas. Entrée massive d’II étrangers : capitalisme patrimonial moderniste. CAC 40 plus ouvert aux fusions-acquisitions, avec une protection étatique des secteurs essentiels."],
  ["Cas Lagardère","Contrôle malgré une participation minoritaire grâce à la SCA. Entrée d’Amber (2020), Vivendi s’allie à Amber et monte à environ 45 % du capital : fragilité des protections juridiques face à l’activisme."]],
 "⚠️ Date de la bataille de Paribas à vérifier (fin des années 90, autour de 1999)."]
];

var state=OQ.map(function(){return {shown:false,r:null}});
var root=document.getElementById("oq-list"),flt=document.getElementById("oq-filter"),sc=document.getElementById("oq-score");
function score(){
  var ok=0,ko=0;state.forEach(function(s){if(s.r===1)ok++;else if(s.r===0)ko++});
  sc.textContent="Je savais : "+ok+" · À revoir : "+ko+" (sur "+OQ.length+")";
}
function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function build(){
  var f=flt.value;root.innerHTML="";var n=0;
  OQ.forEach(function(q,i){
    var s=state[i];
    if(f==="exam"&&q[0].indexOf("Examen")!==0)return;
    if(f==="redo"&&s.r!==0)return;
    n++;
    var card=el("article","oq-card");
    card.appendChild(el("div","oq-tag",q[0]));
    card.appendChild(el("p","oq-q",q[1]));
    var show=el("button",null,s.shown?"Masquer la réponse":"Voir la réponse");
    var ans=el("div","oq-ans");ans.hidden=!s.shown;
    var ol=el("ol","oq-pts");
    q[2].forEach(function(p){var li=el("li");li.appendChild(el("b",null,p[0]+". "));li.appendChild(document.createTextNode(p[1]));ol.appendChild(li)});
    ans.appendChild(ol);
    if(q[3]){var flag=q[3].indexOf("⚠️")>=0;ans.appendChild(el("div",flag?"flag":"note",q[3]))}
    var self=el("div","oq-self");
    var b1=el("button",s.r===1?"on-ok":null,"Je savais"),b0=el("button",s.r===0?"on-ko":null,"À revoir");
    b1.onclick=function(){s.r=(s.r===1?null:1);score();build()};
    b0.onclick=function(){s.r=(s.r===0?null:0);score();build()};
    self.appendChild(b1);self.appendChild(b0);ans.appendChild(self);
    show.onclick=function(){s.shown=!s.shown;ans.hidden=!s.shown;show.textContent=s.shown?"Masquer la réponse":"Voir la réponse"};
    card.appendChild(show);card.appendChild(ans);root.appendChild(card);
  });
  if(!n)root.appendChild(el("p","oq-empty",f==="redo"?"Aucune question marquée « À revoir » pour l’instant.":"Aucune question."));
}
flt.onchange=build;
document.getElementById("oq-reset").onclick=function(){state.forEach(function(s){s.shown=false;s.r=null});score();build()};
score();build();
})();
</script>
